server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded documents: the nginx default (1 MB) is too small for PDFs
    client_max_body_size 50m;

    # /api/... -> the FastAPI service, with the /api prefix removed (same as the Vite dev proxy).
    # The address is resolved through Docker's DNS at request time, so nginx starts even if
    # the api container is not up yet (and follows it when it restarts).
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ingesting a large document can take a while
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri /index.html;
    }
}
